<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de avaliação de produtos WDD131">
    <meta name="author" content="Keyla Vidal">
    <title>Avaliação do Produto</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação do Produto</h1>
    </header>

    <main>
        <form method="get" action="avaliacao.html">
            
            <div class="form-group">
                <label for="productName">Nome do Produto *</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Selecione um Produto...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Classificação Geral *</legend>
                <div class="rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5">☆</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">☆</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">☆</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">☆</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">☆</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Data de Instalação *</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Quais recursos você achou úteis no produto? (Marque todos que se aplicam)</legend>
                <label><input type="checkbox" id="durability" name="features" value="Durabilidade"> Durabilidade</label>
                <label><input type="checkbox" id="ease" name="features" value="Facilidade de Uso"> Facilidade de Uso</label>
                <label><input type="checkbox" id="performance" name="features" value="Desempenho"> Desempenho</label>
                <label><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Avaliação Escrita <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Seu Nome <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Publicar Avaliação">

        </form>
    </main>

    <footer>
        <p>&copy;2026 🌸 Keyla Vidal 🌸</p>
        <p>Manaus, AM</p>
        <p>Última Modificação: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
